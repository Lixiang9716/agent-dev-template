[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-template"
version = "0.1.0"
description = "A language-agnostic governance plane for agent-driven development: gates and notes, delivered by the gov CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agent-dev-template" }]
keywords = ["agent", "governance", "gates", "notes", "development"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
gov = "gov.cli:main"

[tool.setuptools.packages.find]
include = ["gov*"]

[tool.setuptools.package-data]
"gov.templates" = ["*"]
