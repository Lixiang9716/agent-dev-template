name: gov
# govrail: generated by `gov init --ci`; `gov uninstall` removes it.
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install govrail
        run: pip install govrail
      - name: Run the gate DAG
        run: gov run
