name: Record star history

on:
  schedule:
    - cron: '0 0 * * *'   # daily at UTC midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stats branch
        uses: actions/checkout@v4
        with:
          ref: stats

      - name: Record count and regenerate chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stars=$(gh api repos/Lixiang9716/govrail -q .stargazers_count)
          day=$(date -u +%Y-%m-%d)
          if grep -q "^$day," stars.csv; then
            sed -i "s/^$day,.*/$day,$stars/" stars.csv
          else
            echo "$day,$stars" >> stars.csv
          fi
          git fetch origin master --depth=1
          git show origin/master:scripts/stars_chart.py > /tmp/stars_chart.py
          python3 /tmp/stars_chart.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stars.csv stars.svg
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "record stars $(date -u +%Y-%m-%d)"
            git push origin HEAD:stats
          fi
