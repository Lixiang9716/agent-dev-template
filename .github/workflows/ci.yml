name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # note-presence's auto base walks back from HEAD; shallow clones
          # would cascade to "everything is the change". Tags feed the
          # HIGHLIGHTS version-alignment guard (issue #92).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Rejection cases
        run: gov self-test
      - name: Full gate DAG
        run: gov run --mode all
