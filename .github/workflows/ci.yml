name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        # Each leg validates its own port of the governance scripts: the bash
        # twin on Linux, the pwsh twin on Linux, macOS, and Windows (macOS
        # ships bash 3.2, so only the pwsh twin runs there).
        include:
          - os: ubuntu-latest
            shell: sh
          - os: ubuntu-latest
            shell: pwsh
          - os: macos-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Run all gates (bash)
        if: matrix.shell == 'sh'
        run: bash scripts/gates.sh --mode all
      - name: Run all gates (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: pwsh -File scripts/gates.ps1 -Mode all

  # Always runs: GitHub counts a skipped required check as passing, so a
  # failed dependency must not silence the verdict.
  summary:
    needs: [gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gates must have succeeded
        run: test "${{ needs.gates.result }}" = "success"
