name: Publish

# release-please publishes a GitHub Release when its release PR merges
# (v0.26.0 and later); this workflow turns each such release into a PyPI
# upload. Manual runs (workflow_dispatch) exist for retries and backfill.
#
# Auth is PyPI Trusted Publishing (OIDC) — no API token secret. One-time
# setup on pypi.org, project govrail → Settings → Publishing → add a
# trusted publisher with: owner Lixiang9716, repo govrail, workflow
# publish.yml, environment pypi. Until that is saved, uploads fail loudly
# on the PyPI side; nothing is half-published.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard — gov.__version__ matches the released tag
        if: github.event_name == 'release'
        run: |
          V=$(python -c 'from gov import __version__; print(__version__)')
          T="${GITHUB_REF_NAME#v}"
          if [ "$V" != "$T" ]; then
            echo "gov.__version__ ($V) != released tag ($T)"; exit 1
          fi
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
