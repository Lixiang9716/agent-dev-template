# git-cliff configuration — generates CHANGELOG.md from conventional commits.

[changelog]
header = "# Changelog\n\nAll notable changes to govrail are documented here, grouped by\nconventional-commit type. This file is generated by git-cliff; do not edit by\nhand.\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^test", group = "Testing" },
]
